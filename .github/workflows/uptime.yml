name: GronnFalk Uptime Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check websites and search API
        run: |
          node <<'NODE'
          const checks = [
            {
              name: "GronnFalk GitHub Pages",
              url: "https://liamprosser77.github.io/gronnfalk/"
            },
            {
              name: "GronnFalk Render website",
              url: "https://gronnfalk-space.onrender.com/index.html"
            }
          ];

          async function checkPage(item) {
            const response = await fetch(item.url, {
              signal: AbortSignal.timeout(60000)
            });

            if (!response.ok) {
              throw new Error(`${item.name}: HTTP ${response.status}`);
            }

            console.log(`PASS: ${item.name}`);
          }

          async function checkSearch() {
            const url =
              "https://gronnfalk-api-aijg.onrender.com/search?q=dog";

            const response = await fetch(url, {
              signal: AbortSignal.timeout(90000)
            });

            if (!response.ok) {
              throw new Error(`Render API: HTTP ${response.status}`);
            }

            const data = await response.json();

            if (!Array.isArray(data.results)) {
              throw new Error("API response has no results array");
            }

            if (data.results.length === 0) {
              throw new Error("Search returned zero results");
            }

            if (!data.results.some(
              result => result.title && result.url
            )) {
              throw new Error("No valid search results found");
            }

            console.log(
              `PASS: Search API returned ${data.results.length} results`
            );
          }

          async function main() {
            const checksToRun = [
              ...checks.map(checkPage),
              checkSearch()
            ];

            const results = await Promise.allSettled(checksToRun);
            let failed = false;

            for (const result of results) {
              if (result.status === "rejected") {
                failed = true;
                console.error("FAIL:", result.reason.message);
              }
            }

            if (failed) process.exit(1);
            console.log("All GronnFalk checks passed.");
          }

          main().catch(error => {
            console.error("Uptime check failed:", error);
            process.exit(1);
          });
          NODE
